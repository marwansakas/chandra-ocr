<p>بسم الله الرحمن الرحيم<br/>الحمد لله رب العالمين<br/>والصلاة والسلام على من لا نبي بعده<br/>وبعد فقد كتب هذا الكتاب في سنة ١٤٠٠<br/>في شهر رمضان المبارك<br/>في دار العلم والهدى<br/>بمكة المكرمة<br/>لأبي عبد الله محمد بن أحمد<br/>بن عبد الله بن محمد<br/>بن عبد الله بن محمد<br/>بن عبد الله بن محمد<br/>بن عبد الله</p>
