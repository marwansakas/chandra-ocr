<p>بسم الله الرحمن الرحيم<br/>الحمد لله رب العالمين<br/>والصلاة والسلام على من لا نبي بعده<br/>وبعد فقد أخذت في كتابة هذا الكتاب<br/>الذي هو عبارة عن شرح لبعض<br/>الآيات القرآنية التي هي من<br/>الآيات المعجزة التي نزلت على<br/>رسول الله صلى الله عليه وسلم<br/>في مكة المكرمة في شهر رمضان<br/>الذي مضى من سنة ١٤�</p>
