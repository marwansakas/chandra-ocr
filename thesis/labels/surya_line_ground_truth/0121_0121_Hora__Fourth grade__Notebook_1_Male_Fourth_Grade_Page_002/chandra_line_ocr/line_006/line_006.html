<p>بسم الله الرحمن الرحيم<br/>الحمد لله رب العالمين<br/>والصلاة والسلام على من لا نبي بعده<br/>وبعد فقد كتب هذا الكتاب في سنة<br/>الخمسمائة وثمانين<br/>في شهر رمضان المبارك<br/>في دار العلم في مدينة دمشق<br/>بمؤلفه السيد محمد بن أحمد بن<br/>أبي بكر بن علي بن محمد بن<br/>أبي بكر بن علي بن محمد بن<br/>أبي بكر بن علي بن محمد بن</p>
